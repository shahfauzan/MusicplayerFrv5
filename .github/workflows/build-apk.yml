name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: |
          SETTINGS=$(find . -maxdepth 3 -name 'settings.gradle*' -not -path '*/node_modules/*' | head -n1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle not found"; exit 1; fi
          cd "$(dirname "$SETTINGS")"
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FR-SHAH-Music-Player-apk
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FR SHAH Music Player build ${{ github.run_number }}
          files: "**/build/outputs/apk/debug/*.apk"